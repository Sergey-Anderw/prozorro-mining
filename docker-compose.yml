version: '3.9'

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: prozorro
      POSTGRES_USER: prozorro
      POSTGRES_PASSWORD: prozorro
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prozorro"]
      interval: 10s
      retries: 5

volumes:
  postgres_data:
